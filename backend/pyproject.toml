[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Venugopal Tilgul", email = "vendev19@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0.0",
    "cryptography>=50.0.0",
    "fastapi>=0.141.1",
    "openai>=3.3.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.3",
    "supabase>=2.31.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
