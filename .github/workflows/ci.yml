name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, build, typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      # Placeholders so the build can compile; CI never talks to the real project.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Build before typecheck: `next build` generates next-env.d.ts and route types that tsc needs.
      - run: npm run build
      - run: npx tsc --noEmit

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: uv run pytest -q

  rls:
    # Optional: live access-rule (RLS) tests against the Supabase project (backend/tests/test_rls.py).
    # They create temporary choir.e2e.rls.* users and delete them afterwards. They run only when the
    # repository secrets SUPABASE_URL, SUPABASE_ANON_KEY and SUPABASE_SERVICE_ROLE_KEY are set
    # (Settings > Secrets and variables > Actions); otherwise every step below is skipped.
    # Pull requests from forks never receive secrets, so they skip too.
    name: Backend (live RLS tests, optional)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      RLS_TESTS: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      HAS_SECRETS: ${{ secrets.SUPABASE_URL != '' && secrets.SUPABASE_ANON_KEY != '' && secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
    steps:
      - name: Skip without Supabase secrets
        if: env.HAS_SECRETS != 'true'
        working-directory: .
        run: echo "::notice::Live RLS tests skipped. Add the Supabase repository secrets to run them."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: astral-sh/setup-uv@v6
        if: env.HAS_SECRETS == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
        if: env.HAS_SECRETS == 'true'
      - run: uv run pytest -q -rs tests/test_rls.py
        if: env.HAS_SECRETS == 'true'
